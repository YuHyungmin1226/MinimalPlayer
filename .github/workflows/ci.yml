name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-compatibility:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -v
      - name: Check installed dependencies
        run: python -m pip check

  package-smoke:
    name: Package smoke (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
          - name: macOS arm64
            os: macos-14
          - name: Ubuntu x64
            os: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen
      HOMEBREW_NO_AUTO_UPDATE: "1"

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install libmpv on macOS
        if: runner.os == 'macOS'
        run: brew install mpv
      - name: Install libmpv on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Download verified mpv DLL on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -c "import urllib.request; from constants import MPV_DLL_NAME, MPV_DLL_URL; urllib.request.urlretrieve(MPV_DLL_URL, MPV_DLL_NAME)"
          python -c "from constants import MPV_DLL_NAME; from mpv_setup import verify_mpv_dll; raise SystemExit(0 if verify_mpv_dll(MPV_DLL_NAME) else 1)"
      - name: Run unit tests
        run: python -m unittest discover -v
      - name: Build package
        run: python build.py
      - name: Smoke-test Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\dist\MinimalPlayer.exe --smoke-test
      - name: Smoke-test macOS package
        if: runner.os == 'macOS'
        run: dist/MinimalPlayer.app/Contents/MacOS/MinimalPlayer --smoke-test
      - name: Smoke-test Linux package
        if: runner.os == 'Linux'
        run: dist/MinimalPlayer --smoke-test
